name: CI

# Runs on every push to main and on every pull request targeting main so that
# broken code cannot be merged. Configure these jobs as required status checks
# in the branch protection rules for `main` (see docs/ci.md).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same branch/PR to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [frontend, backend]
    defaults:
      run:
        working-directory: srcs/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run ESLint
        run: npm run lint

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Frontend: produce the production Vite bundle.
      - name: Install frontend dependencies
        working-directory: srcs/frontend
        run: npm install --no-audit --no-fund
      - name: Build frontend
        working-directory: srcs/frontend
        run: npm run build

      # Backend: no bundler, so validate that the entrypoint at least parses.
      - name: Install backend dependencies
        working-directory: srcs/backend
        run: npm install --no-audit --no-fund
      - name: validate Prisma schema
        working-directory: srcs/backend
        env:
          DATABASE_URL: "postgresql://user:password@localhost:5432/db"
        run: npx prisma validate
      - name: Generate Prisma Client
        working-directory: srcs/backend
        env:
          DATABASE_URL: "postgresql://user:password@localhost:5432/db"
        run: npx prisma generate
      - name: Check backend syntax
        working-directory: srcs/backend
        run: npx tsc --noEmit

  test:
    name: Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: srcs/backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U user -d db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: "postgresql://user:password@localhost:5432/db"
      JWT_SECRET: "test-jwt-secret"
      JWT_REFRESH_SECRET: "test-jwt-refresh-secret"
      # env.ts validates these at import time; the tests boot the app, so they
      # must be present even though no test performs a real 42 OAuth exchange.
      FT_API_UID: "test-ft-uid"
      FT_API_SECRET: "test-ft-secret"
      FT_API_CALLBACK_URL: "http://localhost:9000/api/auth/42/callback"
      FRONTEND_URL: "http://localhost:5173"
      # The seed writes real bytes for the demo media. Its default target is
      # /app/uploads, which only exists inside the backend container, so point
      # it somewhere this runner owns.
      UPLOAD_DIR: "${{ runner.temp }}/uploads"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Generate Prisma Client
        run: npx prisma generate
      - name: Apply database migrations
        run: npx prisma migrate deploy
      - name: Run tests
        run: npm test
      - name: Seed database twice (idempotency check)
        run: npm run seed && npm run seed
