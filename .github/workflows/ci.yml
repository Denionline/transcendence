name: CI

# Runs on every push to main and on every pull request targeting main so that
# broken code cannot be merged. Configure these jobs as required status checks
# in the branch protection rules for `main` (see docs/ci.md).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same branch/PR to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (${{ matrix.service }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [frontend, backend]
    defaults:
      run:
        working-directory: srcs/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Run ESLint
        run: npm run lint

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install backend dependencies
        working-directory: srcs/backend
        run: npm ci --no-audit --no-fund

      # Frontend: produce the production Vite bundle.
      - name: Install frontend dependencies
        working-directory: srcs/frontend
        run: npm ci --no-audit --no-fund
      - name: Build frontend
        working-directory: srcs/frontend
        run: npm run build

      # Backend: no bundler, so validate that the entrypoint at least parses.
      - name: validate Prisma schema
        working-directory: srcs/backend
        env:
          DATABASE_URL: "postgresql://user:password@localhost:5432/db"
        run: npx prisma validate
      - name: Generate Prisma Client
        working-directory: srcs/backend
        env:
          DATABASE_URL: "postgresql://user:password@localhost:5432/db"
        run: npx prisma generate
      - name: Check backend syntax
        working-directory: srcs/backend
        run: npx tsc --noEmit

  proxy:
    name: Proxy config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Provide an env file
        run: cp .env.example .env
      - name: Validate the compose file
        run: docker compose -f srcs/docker-compose.yml --env-file .env.example config --quiet
      - name: Build the nginx image
        run: docker build -t proxy-check srcs/nginx
      - name: Check the rendered nginx config (upstream names must resolve)
        run: |
          docker run --rm \
            -e NGINX_ENVSUBST_FILTER='^NGINX_' \
            -e NGINX_HTTPS_PORT=8443 \
            -e NGINX_MAX_BODY_SIZE=50m \
            --add-host backend:127.0.0.1 \
            --add-host frontend:127.0.0.1 \
            --entrypoint /bin/sh proxy-check \
            -c '/docker-entrypoint.sh nginx -t'

  test-frontend:
    name: Test (frontend)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: srcs/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install backend dependencies
        working-directory: srcs/backend
        run: npm ci --no-audit --no-fund
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Run tests
        run: npm test

  test:
    name: Test (backend)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: srcs/backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: user
          POSTGRES_PASSWORD: password
          POSTGRES_DB: db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U user -d db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: "postgresql://user:password@localhost:5432/db"
      JWT_SECRET: "test-jwt-secret"
      JWT_REFRESH_SECRET: "test-jwt-refresh-secret"
      # env.ts validates these at import time; the tests boot the app, so they
      # must be present even though no test performs a real 42 OAuth exchange.
      FT_API_UID: "test-ft-uid"
      FT_API_SECRET: "test-ft-secret"
      FT_API_CALLBACK_URL: "http://localhost:9000/api/auth/42/callback"
      FRONTEND_URL: "http://localhost:5173"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Point UPLOAD_DIR at the runner's temp directory
        run: echo "UPLOAD_DIR=$RUNNER_TEMP/uploads" >> "$GITHUB_ENV"
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Generate Prisma Client
        run: npx prisma generate
      - name: Apply database migrations
        run: npx prisma migrate deploy
      - name: Run tests
        run: npm test
      - name: Seed database twice (idempotency check)
        run: npm run seed && npm run seed
