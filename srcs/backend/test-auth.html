<!doctype html>
<html lang="pt">
<head>
<meta charset="utf-8" />
<title>Teste Auth - Refresh Token</title>
<style>
  body { font-family: sans-serif; max-width: 700px; margin: 2rem auto; }
  fieldset { margin-bottom: 1.5rem; }
  input { display: block; margin: 0.3rem 0; padding: 0.4rem; width: 100%; box-sizing: border-box; }
  button { margin-top: 0.5rem; padding: 0.5rem 1rem; cursor: pointer; }
  pre { background: #eee; padding: 1rem; white-space: pre-wrap; word-break: break-all; }
</style>
</head>
<body>
<h1>Teste de Auth (register / login / refresh)</h1>
<p>API: <code id="api-url"></code></p>

<fieldset>
  <legend>Register</legend>
  <input id="reg-email" placeholder="email" value="teste@x.com" />
  <input id="reg-password" placeholder="password" value="12345678" />
  <input id="reg-name" placeholder="name" value="Teste" />
  <input id="reg-role" placeholder="role (artist/hirer)" value="artist" />
  <button onclick="doRegister()">Register</button>
</fieldset>

<fieldset>
  <legend>Login</legend>
  <input id="login-email" placeholder="email" value="teste@x.com" />
  <input id="login-password" placeholder="password" value="12345678" />
  <button onclick="doLogin()">Login</button>
</fieldset>

<fieldset>
  <legend>Refresh</legend>
  <button onclick="doRefresh()">Chamar /auth/refresh</button>
</fieldset>

<h3>Resultado:</h3>
<pre id="output">(nada ainda)</pre>

<script>
  const API = "http://localhost:9000";
  document.getElementById("api-url").textContent = API;

  function log(label, res, body) {
    const el = document.getElementById("output");
    el.textContent =
      `${label}\nstatus: ${res.status}\ncookies visiveis ao JS: ${document.cookie || "(nenhum, esperado por causa do httpOnly)"}\n\nbody:\n${JSON.stringify(body, null, 2)}`;
  }

  async function doRegister() {
    const res = await fetch(`${API}/auth/register`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      credentials: "include",
      body: JSON.stringify({
        email: document.getElementById("reg-email").value,
        password: document.getElementById("reg-password").value,
        name: document.getElementById("reg-name").value,
        role: document.getElementById("reg-role").value,
      }),
    });
    log("REGISTER", res, await res.json());
  }

  async function doLogin() {
    const res = await fetch(`${API}/auth/login`, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      credentials: "include",
      body: JSON.stringify({
        email: document.getElementById("login-email").value,
        password: document.getElementById("login-password").value,
      }),
    });
    log("LOGIN", res, await res.json());
  }

  async function doRefresh() {
    const res = await fetch(`${API}/auth/refresh`, {
      method: "POST",
      credentials: "include",
    });
    log("REFRESH", res, await res.json());
  }
</script>
</body>
</html>
