services:
  database:
    build: ./database
    image: trans_db
    container_name: transcendence-db
    env_file: ../.env
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - matosinhos

  backend:
    build:
      context: ./backend
    image: trans_be
    container_name: express_backend
    env_file: ../.env
    ports:
      - "9000:9000"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}?schema=public
      PORT: 9000
      UPLOAD_DIR: /app/uploads
    volumes:
      - uploads:/app/uploads
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://localhost:9000/health').then(r => r.json()).then(d => process.exit(d.status === 'ok' ? 0 : 1)).catch(() => process.exit(1))\"",
        ]
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - matosinhos

  frontend:
    build:
      context: ./frontend
    image: trans-fe
    container_name: react_frontend
    env_file: ../.env
    ports:
      - "5173:5173"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:5173').then(() => process.exit(0)).catch(() => process.exit(1))\""]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - matosinhos

volumes:
  pgdata:
  uploads:

networks:
  matosinhos:
    name: matosinhos
    driver: bridge
