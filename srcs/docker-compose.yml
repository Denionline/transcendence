services:
  database:
    build: ./database
    container_name: transcendence-db
    env_file: ../.env
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER}"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - matosinhos

  backend:
    build:
      context: ./backend
    container_name: express_backend
    volumes:
      - ./backend:/app
      - /app/node_modules
    env_file: ../.env
    ports:
      - "9000:9000"
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@database:5432/${POSTGRES_DB}?schema=public
      PORT: 9000
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:9000').then(() => process.exit(0)).catch(() => process.exit(1))\""]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - matosinhos

  frontend:
    build:
      context: ./frontend
    container_name: react_frontend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    env_file: ../.env
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000').then(() => process.exit(0)).catch(() => process.exit(1))\""]
      interval: 30s
      timeout: 10s
      start_period: 15s
      retries: 3
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - matosinhos

volumes:
  pgdata:

networks:
  matosinhos:
    driver: bridge
